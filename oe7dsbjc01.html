<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Suivi du match</title>
<style>
  :root{
    --vert:#1f5f3f; --vert-clair:#2e8659; --fond:#f4f6f4; --carte:#ffffff;
    --texte:#1a2a22; --texte-doux:#5c6b62; --ligne:#dfe6e1; --rouge:#b3413a;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--fond); color:var(--texte); padding-bottom:3rem; }
  header{ background:var(--vert); color:#fff; padding:1rem; }
  header.tete-parent{ text-align:center; padding:1.25rem 1rem 1.5rem; }
  .adversaire{ font-size:15px; opacity:0.85; margin:0 0 4px; }
  .score{ font-size:44px; font-weight:700; letter-spacing:1px; }
  .minute{ font-size:13px; opacity:0.75; margin-top:2px; }
  main{ max-width:520px; margin:0 auto; padding:1.25rem 1rem; }
  .section-label{ font-size:13px; color:var(--texte-doux); font-weight:600;
    text-transform:uppercase; letter-spacing:0.04em; margin:0 0 12px; }
  .grille-joueurs{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:1.5rem; }
  .btn-joueur{ background:var(--carte); border:1.5px solid var(--ligne); border-radius:12px;
    padding:16px 8px; font-size:16px; font-weight:600; color:var(--texte); cursor:pointer;
    min-height:56px; -webkit-tap-highlight-color:transparent; transition:transform 0.08s ease, background 0.15s ease; }
  .btn-joueur:active{ transform:scale(0.96); background:var(--vert-clair); color:#fff; border-color:var(--vert-clair); }
  .btn-secondaire{ width:100%; background:var(--carte); border:1.5px solid var(--ligne); border-radius:10px;
    padding:12px; font-size:14px; color:var(--texte-doux); margin-bottom:10px; cursor:pointer; }
  .btn-secondaire:active{ background:var(--ligne); }
  .btn-annuler{ color:var(--rouge); border-color:#e3cfcd; }
  .overlay{ position:fixed; inset:0; background:rgba(10,20,15,0.55); display:none;
    align-items:flex-end; justify-content:center; z-index:50; }
  .overlay.actif{ display:flex; }
  .modal{ background:var(--carte); width:100%; max-width:480px; border-radius:20px 20px 0 0;
    padding:1.5rem 1.25rem 2rem; animation:remonter 0.2s ease-out; }
  @keyframes remonter{ from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  .confirmation{ display:flex; align-items:center; gap:10px; font-size:17px; font-weight:600; color:var(--vert); margin-bottom:1rem; }
  .pastille-ok{ width:26px;height:26px;border-radius:50%; background:var(--vert-clair); color:#fff;
    display:flex;align-items:center;justify-content:center; font-size:15px; flex-shrink:0; }
  .grille-passeurs{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:1rem; }
  .btn-passeur{ background:var(--fond); border:1.5px solid var(--ligne); border-radius:10px;
    padding:12px 6px; font-size:14px; font-weight:500; cursor:pointer; }
  .btn-passeur:active{ background:var(--vert-clair); color:#fff; }
  .fermer-modal{ width:100%; text-align:center; background:none; border:none; color:var(--texte-doux);
    font-size:14px; padding:10px; cursor:pointer; }
  .etat{ text-align:center; color:var(--texte-doux); font-size:14px; padding:2rem 1rem; }
  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--texte);
    color:#fff; padding:10px 18px; border-radius:24px; font-size:13px; opacity:0; pointer-events:none;
    transition:opacity 0.25s ease; z-index:60; }
  .toast.visible{ opacity:1; }
</style>
</head>
<body>

<div id="racine"></div>
<div class="toast" id="toast"></div>

<script>
// ⚠️ Remplacez par l'URL de votre déploiement Apps Script (se terminant par /exec)
const API_URL = 'https://script.google.com/macros/s/AKfycby6pUMd49pdfWTzTAwVIg_RxcOzKml9lUIVl3UDOxSeCaT-DwiJdvcbMidFIlMuHULf/exec';

const params = new URLSearchParams(window.location.search);
const matchIdDansUrl = params.get('match');
const racine = document.getElementById('racine');

function afficherToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visible');
  setTimeout(()=> t.classList.remove('visible'), 2200);
}

async function appelApi(action, data){
  data = data || {};
  data.action = action;
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(data)
  });
  return res.json();
}

async function appelApiGet(qs){
  const res = await fetch(`${API_URL}?${qs}`);
  return res.json();
}

/* Cette page ne contient QUE la vue parents. Sans identifiant de match ou
   de journée valide dans l'URL, elle n'affiche rien d'exploitable —
   aucune autre fonctionnalité de l'outil n'est accessible depuis ce fichier. */

const equipeDansUrl = params.get('equipe');
const dateDansUrl = params.get('date');

if (matchIdDansUrl) {
  demarrerVueParents(matchIdDansUrl, racine);
} else if (equipeDansUrl && dateDansUrl) {
  demarrerVueJournee(equipeDansUrl, dateDansUrl);
} else {
  racine.innerHTML = `<main><p class="etat">Lien invalide.</p></main>`;
}

/**
 * Mode "journée" (plateau/tournoi) : plusieurs matchs pour une même équipe
 * le même jour. Affiche un sélecteur en haut, et charge le match choisi
 * dans un sous-conteneur en réutilisant demarrerVueParents.
 */
function demarrerVueJournee(equipe, date){
  racine.innerHTML = `
    <div id="selecteur-journee" style="padding:1rem 1rem 0; max-width:520px; margin:0 auto;"></div>
    <div id="conteneur-match"></div>
  `;

  let matchsJour = [];
  let matchActifId = null;
  let arreterMatchActif = null;

  function choisirMatchParDefaut(){
    const maintenant = new Date();
    const hhmm = maintenant.toTimeString().slice(0,5);
    const aVenir = matchsJour.find(m => m.heureDebut && m.heureDebut >= hhmm);
    return (aVenir || matchsJour[matchsJour.length - 1]).matchId;
  }

  function renderSelecteur(){
    const box = document.getElementById('selecteur-journee');
    if(matchsJour.length === 0){
      box.innerHTML = '<p class="etat">Aucun match trouvé pour cette journée.</p>';
      return;
    }
    box.innerHTML = `
      <p class="section-label" style="margin-bottom:8px;">Choisir le match à saisir</p>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:4px;">
        ${matchsJour.map(m => `
          <button data-id="${m.matchId}" style="padding:8px 12px; border-radius:20px; border:1.5px solid var(--ligne);
            font-size:13px; font-weight:600; cursor:pointer;
            background:${m.matchId===matchActifId ? 'var(--vert)' : 'var(--carte)'};
            color:${m.matchId===matchActifId ? '#fff' : 'var(--texte)'};">
            ${m.heureDebut || '--:--'} vs ${m.adversaire || '?'}
          </button>`).join('')}
      </div>
    `;
    box.querySelectorAll('button[data-id]').forEach(btn=>{
      btn.addEventListener('click', ()=> selectionnerMatch(btn.dataset.id));
    });
  }

  function selectionnerMatch(matchId){
    if(matchId === matchActifId) return;
    if(arreterMatchActif) arreterMatchActif();
    matchActifId = matchId;
    renderSelecteur();
    arreterMatchActif = demarrerVueParents(matchId, document.getElementById('conteneur-match'));
  }

  async function chargerListe(premierChargement){
    try {
      const data = await appelApiGet(`action=matchsJournee&equipe=${encodeURIComponent(equipe)}&date=${encodeURIComponent(date)}`);
      if(!data.ok) return;
      matchsJour = data.matchs || [];
      if(premierChargement){
        if(matchsJour.length === 0){
          renderSelecteur();
          return;
        }
        matchActifId = choisirMatchParDefaut();
        renderSelecteur();
        arreterMatchActif = demarrerVueParents(matchActifId, document.getElementById('conteneur-match'));
      } else {
        renderSelecteur();
      }
    } catch (err) {
      if(premierChargement){
        document.getElementById('selecteur-journee').innerHTML =
          `<p class="etat" style="color:var(--rouge)">Impossible de contacter le serveur.</p>`;
      }
    }
  }

  chargerListe(true);
  setInterval(()=> chargerListe(false), 15000);
}

/**
 * Vue d'un match unique. Rend dans `conteneur` (racine par défaut pour un
 * lien à match unique). Renvoie une fonction d'arrêt qui coupe le polling —
 * à appeler avant de changer de match en mode journée.
 */
function demarrerVueParents(matchId, conteneur){
  conteneur = conteneur || racine;
  conteneur.innerHTML = `
    <header class="tete-parent">
      <p class="adversaire" id="p-adversaire">Chargement…</p>
      <div class="score" id="p-score">0 - 0</div>
      <p class="minute" id="p-minute"></p>
    </header>
    <main><div id="p-contenu"><p class="etat">Chargement du match…</p></div></main>
    <div class="overlay" id="p-overlay">
      <div class="modal">
        <div class="confirmation">
          <span class="pastille-ok">✓</span>
          <span id="p-texteConfirmation">But enregistré</span>
        </div>
        <p class="section-label">Passe décisive ? (facultatif)</p>
        <div class="grille-passeurs" id="p-grillePasseurs"></div>
        <button class="fermer-modal" id="p-fermer-modal">Fermer sans passeur</button>
      </div>
    </div>
  `;

  let etatMatch = null;
  let dernierEventId = null;

  async function charger(){
    try {
      const data = await appelApiGet(`action=match&matchId=${encodeURIComponent(matchId)}`);
      if(!data.ok || !data.match.info){
        conteneur.querySelector('#p-contenu').innerHTML = '<p class="etat">Match introuvable. Vérifiez le lien reçu.</p>';
        return;
      }
      etatMatch = data.match;
      render();
    } catch (err) {
      conteneur.querySelector('#p-contenu').innerHTML =
        `<p class="etat" style="color:var(--rouge)">Impossible de contacter le serveur.<br>Détail : ${String(err.message || err)}</p>`;
    }
  }

  function render(){
    const info = etatMatch.info;
    conteneur.querySelector('#p-adversaire').textContent = `${info.equipe || 'Équipe'} vs ${info.adversaire}`;
    conteneur.querySelector('#p-score').textContent = `${etatMatch.scoreNous} - ${etatMatch.scoreAdverse}`;
    conteneur.querySelector('#p-minute').textContent = etatMatch.derniereAction && etatMatch.derniereAction.minute !== ''
      ? `Dernière action : ${etatMatch.derniereAction.minute}e minute` : '';

    const convocations = etatMatch.convocations || [];
    const boutons = convocations.map(j =>
      `<button class="btn-joueur" data-joueur="${j.replace(/"/g,'&quot;')}">${j}</button>`
    ).join('');

    conteneur.querySelector('#p-contenu').innerHTML = `
      <p class="section-label">Toucher le buteur</p>
      <div class="grille-joueurs">${boutons}</div>
      <button class="btn-secondaire" id="p-btn-adverse">But adverse (score seulement)</button>
      <button class="btn-secondaire btn-annuler" id="p-btn-annuler">Annuler la dernière action</button>
    `;

    conteneur.querySelectorAll('#p-contenu .btn-joueur').forEach(btn=>{
      btn.addEventListener('click', ()=> marquerBut(btn.dataset.joueur));
    });
    conteneur.querySelector('#p-btn-adverse').addEventListener('click', butAdverse);
    conteneur.querySelector('#p-btn-annuler').addEventListener('click', annulerDerniere);
  }

  let promesseButEnCours = null;

  function marquerBut(joueur){
    // Mise à jour optimiste : on ouvre tout de suite la fenêtre de passe avec
    // la liste déjà connue localement, sans attendre la réponse du serveur.
    dernierEventId = null;
    ouvrirModalPasse(joueur);

    promesseButEnCours = appelApi('enregistrerBut', { matchId, buteur: joueur, role: 'parent' })
      .then(data => {
        if(!data.ok){ afficherToast('Erreur, réessayez.'); return null; }
        etatMatch = data.match;
        dernierEventId = data.eventId;
        render();
        return data.eventId;
      })
      .catch(()=>{ afficherToast('Erreur, réessayez.'); return null; });
  }

  function ouvrirModalPasse(joueur){
    conteneur.querySelector('#p-texteConfirmation').textContent = `But de ${joueur} enregistré`;
    const autres = (etatMatch.convocations || []).filter(j => j !== joueur);
    conteneur.querySelector('#p-grillePasseurs').innerHTML = autres.map(j =>
      `<button class="btn-passeur" data-joueur="${j.replace(/"/g,'&quot;')}">${j}</button>`
    ).join('');
    conteneur.querySelectorAll('#p-grillePasseurs .btn-passeur').forEach(btn=>{
      btn.addEventListener('click', ()=> choisirPasseur(btn.dataset.joueur));
    });
    conteneur.querySelector('#p-overlay').classList.add('actif');
  }

  function fermerModalPasse(){
    conteneur.querySelector('#p-overlay').classList.remove('actif');
  }
  conteneur.querySelector('#p-fermer-modal').addEventListener('click', fermerModalPasse);

  async function choisirPasseur(passeur){
    fermerModalPasse();
    // Si le but n'a pas encore fini de s'enregistrer côté serveur (cas rare,
    // clic très rapide), on patiente juste ce qu'il faut pour avoir l'eventId.
    const eventId = dernierEventId || (promesseButEnCours && await promesseButEnCours);
    if(!eventId){ afficherToast('Erreur, réessayez.'); return; }
    const data = await appelApi('enregistrerPasse', { matchId, eventId, passeur });
    if(data.ok){ etatMatch = data.match; render(); afficherToast(`Passe de ${passeur} notée`); }
  }

  async function butAdverse(){
    const data = await appelApi('butAdverse', { matchId, role: 'parent' });
    if(data.ok){ etatMatch = data.match; render(); }
  }

  async function annulerDerniere(){
    if(!confirm('Annuler la toute dernière action enregistrée ?')) return;
    const data = await appelApi('annulerDerniere', { matchId });
    if(data.ok){ etatMatch = data.match; render(); afficherToast('Dernière action annulée'); }
    else afficherToast(data.error || 'Rien à annuler.');
  }

  charger();
  const intervalId = setInterval(charger, 8000);
  return function arreter(){ clearInterval(intervalId); };
}
</script>
</body>
</html>
