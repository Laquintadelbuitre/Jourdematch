<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Matchday — U13</title>
<style>
  :root{
    --vert:#1f5f3f; --vert-clair:#2e8659; --fond:#f4f6f4; --carte:#ffffff;
    --texte:#1a2a22; --texte-doux:#5c6b62; --ligne:#dfe6e1; --rouge:#b3413a;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--fond); color:var(--texte); padding-bottom:3rem; }
  header{ background:var(--vert); color:#fff; padding:1rem; }
  header.tete-parent{ text-align:center; padding:1.25rem 1rem 1.5rem; }
  header.tete-coach{ display:flex; align-items:center; justify-content:space-between; }
  header.tete-coach h1{ font-size:16px; font-weight:600; margin:0; }
  header.tete-coach button{ background:rgba(255,255,255,0.15); color:#fff; border:none;
    border-radius:8px; padding:8px 12px; font-size:13px; cursor:pointer; }
  .adversaire{ font-size:15px; opacity:0.85; margin:0 0 4px; }
  .score{ font-size:44px; font-weight:700; letter-spacing:1px; }
  .minute{ font-size:13px; opacity:0.75; margin-top:2px; }
  main{ max-width:520px; margin:0 auto; padding:1.25rem 1rem; }
  .carte{ background:var(--carte); border:1px solid var(--ligne); border-radius:14px; padding:1.25rem; margin-bottom:1.25rem; }
  .section-label{ font-size:13px; color:var(--texte-doux); font-weight:600;
    text-transform:uppercase; letter-spacing:0.04em; margin:0 0 12px; }
  input, select, textarea{ width:100%; padding:10px 12px; border:1.5px solid var(--ligne);
    border-radius:8px; font-size:15px; margin-bottom:10px; background:#fff; color:var(--texte); font-family:inherit; }
  label.champ{ font-size:13px; color:var(--texte-doux); display:block; margin-bottom:4px; }
  .btn{ width:100%; padding:12px; border-radius:10px; border:none; font-size:15px; font-weight:600; cursor:pointer; margin-bottom:8px; }
  .btn-principal{ background:var(--vert); color:#fff; }
  .btn-principal:active{ background:var(--vert-clair); }
  .btn-discret{ background:var(--fond); color:var(--texte); border:1.5px solid var(--ligne); }
  .btn-rouge{ background:#fff; color:var(--rouge); border:1.5px solid #e3cfcd; }
  .liste-matchs{ display:flex; flex-direction:column; gap:8px; }
  .item-match{ display:flex; justify-content:space-between; align-items:center;
    padding:12px 14px; border:1.5px solid var(--ligne); border-radius:10px; cursor:pointer; }
  .item-match:active{ background:var(--fond); }
  .item-match .droite{ font-size:12px; color:var(--texte-doux); }
  .grille-cases{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
  .case-joueur{ display:flex; align-items:center; gap:8px; border:1.5px solid var(--ligne);
    border-radius:8px; padding:8px 10px; font-size:14px; }
  .case-joueur input{ width:auto; margin:0; }
  .score-live{ text-align:center; font-size:40px; font-weight:700; margin-bottom:14px; }
  .grille-actions{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
  .lien-parent{ display:flex; gap:8px; align-items:center; background:var(--fond); border-radius:8px;
    padding:10px; margin-bottom:10px; font-size:12px; color:var(--texte-doux); word-break:break-all; }
  .lien-parent button{ flex-shrink:0; background:var(--vert); color:#fff; border:none;
    border-radius:6px; padding:6px 10px; font-size:12px; cursor:pointer; }
  .retour{ background:none; border:none; color:var(--texte-doux); font-size:13px; margin-bottom:14px; cursor:pointer; padding:0; }
  .masque{ display:none; }
  .grille-joueurs{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:1.5rem; }
  .btn-joueur{ background:var(--carte); border:1.5px solid var(--ligne); border-radius:12px;
    padding:16px 8px; font-size:16px; font-weight:600; color:var(--texte); cursor:pointer;
    min-height:56px; -webkit-tap-highlight-color:transparent; transition:transform 0.08s ease, background 0.15s ease; }
  .btn-joueur:active{ transform:scale(0.96); background:var(--vert-clair); color:#fff; border-color:var(--vert-clair); }
  .btn-secondaire{ width:100%; background:var(--carte); border:1.5px solid var(--ligne); border-radius:10px;
    padding:12px; font-size:14px; color:var(--texte-doux); margin-bottom:10px; cursor:pointer; }
  .btn-secondaire:active{ background:var(--ligne); }
  .btn-annuler{ color:var(--rouge); border-color:#e3cfcd; }
  .overlay{ position:fixed; inset:0; background:rgba(10,20,15,0.55); display:none;
    align-items:flex-end; justify-content:center; z-index:50; }
  .overlay.actif{ display:flex; }
  .modal{ background:var(--carte); width:100%; max-width:480px; border-radius:20px 20px 0 0;
    padding:1.5rem 1.25rem 2rem; animation:remonter 0.2s ease-out; }
  @keyframes remonter{ from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  .confirmation{ display:flex; align-items:center; gap:10px; font-size:17px; font-weight:600; color:var(--vert); margin-bottom:1rem; }
  .pastille-ok{ width:26px;height:26px;border-radius:50%; background:var(--vert-clair); color:#fff;
    display:flex;align-items:center;justify-content:center; font-size:15px; flex-shrink:0; }
  .grille-passeurs{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:1rem; }
  .btn-passeur{ background:var(--fond); border:1.5px solid var(--ligne); border-radius:10px;
    padding:12px 6px; font-size:14px; font-weight:500; cursor:pointer; }
  .btn-passeur:active{ background:var(--vert-clair); color:#fff; }
  .fermer-modal{ width:100%; text-align:center; background:none; border:none; color:var(--texte-doux);
    font-size:14px; padding:10px; cursor:pointer; }
  .etat{ text-align:center; color:var(--texte-doux); font-size:14px; padding:2rem 1rem; }
  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--texte);
    color:#fff; padding:10px 18px; border-radius:24px; font-size:13px; opacity:0; pointer-events:none;
    transition:opacity 0.25s ease; z-index:60; }
  .toast.visible{ opacity:1; }
</style>
</head>
<body>

<div id="racine"></div>
<div class="toast" id="toast"></div>

<script>
// ⚠️ Remplacez par l'URL de votre déploiement Apps Script (se terminant par /exec)
const API_URL = 'COLLEZ_ICI_VOTRE_URL_APPS_SCRIPT';

const params = new URLSearchParams(window.location.search);
const matchIdDansUrl = params.get('match');
const racine = document.getElementById('racine');

function afficherToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visible');
  setTimeout(()=> t.classList.remove('visible'), 2200);
}

async function appelApi(action, data){
  data = data || {};
  data.action = action;
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(data)
  });
  return res.json();
}

async function appelApiGet(qs){
  const res = await fetch(`${API_URL}?${qs}`);
  return res.json();
}

/* ============================== VUE PARENTS ============================== */

function demarrerVueParents(matchId){
  racine.innerHTML = `
    <header class="tete-parent">
      <p class="adversaire" id="p-adversaire">Chargement…</p>
      <div class="score" id="p-score">0 - 0</div>
      <p class="minute" id="p-minute"></p>
    </header>
    <main><div id="p-contenu"><p class="etat">Chargement du match…</p></div></main>
    <div class="overlay" id="p-overlay">
      <div class="modal">
        <div class="confirmation">
          <span class="pastille-ok">✓</span>
          <span id="p-texteConfirmation">But enregistré</span>
        </div>
        <p class="section-label">Passe décisive ? (facultatif)</p>
        <div class="grille-passeurs" id="p-grillePasseurs"></div>
        <button class="fermer-modal" onclick="fermerModalPasse()">Fermer sans passeur</button>
      </div>
    </div>
  `;

  let etatMatch = null;
  let dernierEventId = null;

  async function charger(){
    const data = await appelApiGet(`action=match&matchId=${encodeURIComponent(matchId)}`);
    if(!data.ok || !data.match.info){
      document.getElementById('p-contenu').innerHTML = '<p class="etat">Match introuvable. Vérifiez le lien reçu.</p>';
      return;
    }
    etatMatch = data.match;
    render();
  }

  function render(){
    const info = etatMatch.info;
    document.getElementById('p-adversaire').textContent = `U13 vs ${info.adversaire}`;
    document.getElementById('p-score').textContent = `${etatMatch.scoreNous} - ${etatMatch.scoreAdverse}`;
    document.getElementById('p-minute').textContent = etatMatch.derniereAction && etatMatch.derniereAction.minute !== ''
      ? `Dernière action : ${etatMatch.derniereAction.minute}e minute` : '';

    const convocations = etatMatch.convocations || [];
    const boutons = convocations.map(j =>
      `<button class="btn-joueur" data-joueur="${j.replace(/"/g,'&quot;')}">${j}</button>`
    ).join('');

    document.getElementById('p-contenu').innerHTML = `
      <p class="section-label">Toucher le buteur</p>
      <div class="grille-joueurs">${boutons}</div>
      <button class="btn-secondaire" id="p-btn-adverse">But adverse (score seulement)</button>
      <button class="btn-secondaire btn-annuler" id="p-btn-annuler">Annuler la dernière action</button>
    `;

    document.querySelectorAll('#p-contenu .btn-joueur').forEach(btn=>{
      btn.addEventListener('click', ()=> marquerBut(btn.dataset.joueur));
    });
    document.getElementById('p-btn-adverse').addEventListener('click', butAdverse);
    document.getElementById('p-btn-annuler').addEventListener('click', annulerDerniere);
  }

  async function marquerBut(joueur){
    const data = await appelApi('enregistrerBut', { matchId, buteur: joueur, role: 'parent' });
    if(!data.ok){ afficherToast('Erreur, réessayez.'); return; }
    etatMatch = data.match;
    dernierEventId = data.eventId;
    render();
    ouvrirModalPasse(joueur);
  }

  function ouvrirModalPasse(joueur){
    document.getElementById('p-texteConfirmation').textContent = `But de ${joueur} enregistré`;
    const autres = (etatMatch.convocations || []).filter(j => j !== joueur);
    document.getElementById('p-grillePasseurs').innerHTML = autres.map(j =>
      `<button class="btn-passeur" data-joueur="${j.replace(/"/g,'&quot;')}">${j}</button>`
    ).join('');
    document.querySelectorAll('#p-grillePasseurs .btn-passeur').forEach(btn=>{
      btn.addEventListener('click', ()=> choisirPasseur(btn.dataset.joueur));
    });
    document.getElementById('p-overlay').classList.add('actif');
  }

  window.fermerModalPasse = function(){
    document.getElementById('p-overlay').classList.remove('actif');
  };

  async function choisirPasseur(passeur){
    window.fermerModalPasse();
    const data = await appelApi('enregistrerPasse', { matchId, eventId: dernierEventId, passeur });
    if(data.ok){ etatMatch = data.match; render(); afficherToast(`Passe de ${passeur} notée`); }
  }

  async function butAdverse(){
    const data = await appelApi('butAdverse', { matchId, role: 'parent' });
    if(data.ok){ etatMatch = data.match; render(); }
  }

  async function annulerDerniere(){
    if(!confirm('Annuler la toute dernière action enregistrée ?')) return;
    const data = await appelApi('annulerDerniere', { matchId });
    if(data.ok){ etatMatch = data.match; render(); afficherToast('Dernière action annulée'); }
    else afficherToast(data.error || 'Rien à annuler.');
  }

  charger();
  setInterval(charger, 8000);
}

/* ============================== VUE COACH ============================== */

const MOT_DE_PASSE_STOCKE = 'matchday_pwd';

function demarrerVueCoach(){
  const pwd = sessionStorage.getItem(MOT_DE_PASSE_STOCKE);
  if (pwd) {
    afficherAppCoach(pwd);
  } else {
    afficherEcranMotDePasse();
  }
}

function afficherEcranMotDePasse(){
  racine.innerHTML = `
    <header class="tete-coach"><h1>Matchday — vue coach</h1></header>
    <main>
      <div class="carte">
        <p class="section-label">Accès coach</p>
        <label class="champ" for="c-pwd">Code</label>
        <input id="c-pwd" type="password" inputmode="numeric" placeholder="Code à 4 chiffres">
        <button class="btn btn-principal" id="c-btn-entrer">Entrer</button>
        <p id="c-erreurPwd" style="color:var(--rouge); font-size:13px; margin:0;"></p>
      </div>
    </main>
  `;
  document.getElementById('c-btn-entrer').addEventListener('click', ()=>{
    const val = document.getElementById('c-pwd').value.trim();
    if(!val){ document.getElementById('c-erreurPwd').textContent = 'Entrez le code.'; return; }
    sessionStorage.setItem(MOT_DE_PASSE_STOCKE, val);
    afficherAppCoach(val);
  });
}

function afficherAppCoach(pwd){
  let effectif = [];
  let calendrier = [];
  let matchActuel = null;
  let etatMatch = null;

  function enteteCoach(){
    return `
      <header class="tete-coach">
        <h1>Matchday — vue coach</h1>
        <button id="c-deconnexion">Verrouiller</button>
      </header>`;
  }

  async function chargerAccueil(){
    racine.innerHTML = enteteCoach() + `<main><p class="etat">Chargement…</p></main>`;
    const [resCal, resEff] = await Promise.all([
      appelApiGet('action=calendrier'),
      appelApiGet('action=effectif')
    ]);
    calendrier = resCal.ok ? resCal.calendrier : [];
    effectif = resEff.ok ? resEff.effectif : [];
    renderAccueil();
  }

  function renderAccueil(){
    const items = calendrier.slice()
      .sort((a,b)=> new Date(b.date) - new Date(a.date))
      .map(m => `
        <div class="item-match" data-id="${m.matchId}">
          <div>U13 vs ${m.adversaire}</div>
          <div class="droite">${m.date} · ${m.heureDebut}</div>
        </div>`
      ).join('') || '<p style="color:var(--texte-doux); font-size:14px;">Aucun match dans le calendrier pour l’instant.</p>';

    racine.innerHTML = enteteCoach() + `
      <main>
        <div class="carte">
          <p class="section-label">Ajouter un match au calendrier</p>
          <label class="champ" for="nvAdversaire">Adversaire</label>
          <input id="nvAdversaire" placeholder="Nom de l'équipe adverse">
          <label class="champ" for="nvDate">Date</label>
          <input id="nvDate" type="date">
          <label class="champ" for="nvHeure">Heure de début</label>
          <input id="nvHeure" type="time">
          <label class="champ" for="nvLieu">Lieu (facultatif)</label>
          <input id="nvLieu" placeholder="Ex. Stade municipal">
          <button class="btn btn-principal" id="btn-creer-match">Ajouter au calendrier</button>
        </div>

        <div class="carte">
          <p class="section-label">Effectif du groupe (${effectif.length} joueurs)</p>
          <textarea id="effectifTexte" rows="4">${effectif.join(', ')}</textarea>
          <p style="font-size:12px; color:var(--texte-doux); margin:6px 0 10px;">Un nom par virgule. Sert de base pour convoquer les joueurs à chaque match.</p>
          <button class="btn btn-discret" id="btn-maj-effectif">Mettre à jour l'effectif</button>
        </div>

        <div class="carte">
          <p class="section-label">Calendrier des matchs</p>
          <div class="liste-matchs">${items}</div>
        </div>
      </main>
    `;

    document.getElementById('c-deconnexion').addEventListener('click', deconnexion);
    document.getElementById('btn-creer-match').addEventListener('click', creerMatch);
    document.getElementById('btn-maj-effectif').addEventListener('click', enregistrerEffectif);
    document.querySelectorAll('.item-match').forEach(el=>{
      el.addEventListener('click', ()=> ouvrirMatch(el.dataset.id));
    });
  }

  function deconnexion(){
    sessionStorage.removeItem(MOT_DE_PASSE_STOCKE);
    afficherEcranMotDePasse();
  }

  async function creerMatch(){
    const adversaire = document.getElementById('nvAdversaire').value.trim();
    const date = document.getElementById('nvDate').value;
    const heureDebut = document.getElementById('nvHeure').value;
    const lieu = document.getElementById('nvLieu').value.trim();
    if(!adversaire || !date || !heureDebut){ afficherToast('Adversaire, date et heure sont nécessaires.'); return; }
    const data = await appelApi('creerMatch', { pwd, adversaire, date, heureDebut, lieu });
    if(data.ok){ afficherToast('Match ajouté au calendrier.'); chargerAccueil(); }
    else afficherToast(data.error || 'Erreur.');
  }

  async function enregistrerEffectif(){
    const joueurs = document.getElementById('effectifTexte').value.split(',').map(s=>s.trim()).filter(Boolean);
    const data = await appelApi('setEffectif', { pwd, joueurs });
    if(data.ok){ effectif = joueurs; afficherToast('Effectif mis à jour.'); }
    else afficherToast(data.error || 'Erreur.');
  }

  async function ouvrirMatch(matchId){
    matchActuel = matchId;
    const res = await appelApiGet(`action=match&matchId=${encodeURIComponent(matchId)}`);
    if(!res.ok){ afficherToast('Erreur de chargement du match.'); return; }
    etatMatch = res.match;
    renderMatch();
  }

  function renderMatch(){
    const info = etatMatch.info;
    const convoques = new Set(etatMatch.convocations || []);
    const cases = effectif.map(j => `
      <label class="case-joueur">
        <input type="checkbox" value="${j}" ${convoques.has(j) ? 'checked' : ''}>
        ${j}
      </label>`
    ).join('');

    const lienParent = `${window.location.origin}${window.location.pathname}?match=${matchActuel}`;

    racine.innerHTML = enteteCoach() + `
      <main>
        <button class="retour" id="btn-retour">&larr; Retour au calendrier</button>

        <div class="carte">
          <p class="section-label">U13 vs ${info.adversaire} — ${info.date} ${info.heureDebut}</p>
          <div class="score-live">${etatMatch.scoreNous} - ${etatMatch.scoreAdverse}</div>
          <div class="grille-actions">
            <button class="btn btn-principal" id="btn-action-but">But (nous)</button>
            <button class="btn btn-discret" id="btn-action-adverse">But adverse</button>
          </div>
          <button class="btn btn-rouge" id="btn-action-annuler">Annuler la dernière action</button>
        </div>

        <div class="carte">
          <p class="section-label">Lien à envoyer aux parents pour ce match</p>
          <div class="lien-parent">
            <span>${lienParent}</span>
            <button id="btn-copier-lien">Copier</button>
          </div>
        </div>

        <div class="carte">
          <p class="section-label">Convocations (${convoques.size} sélectionné${convoques.size>1?'s':''})</p>
          <div class="grille-cases">${cases}</div>
          <button class="btn btn-principal" id="btn-save-convocations">Enregistrer les convocations</button>
        </div>
      </main>
    `;

    document.getElementById('c-deconnexion').addEventListener('click', deconnexion);
    document.getElementById('btn-retour').addEventListener('click', renderAccueil);
    document.getElementById('btn-action-but').addEventListener('click', actionBut);
    document.getElementById('btn-action-adverse').addEventListener('click', actionButAdverse);
    document.getElementById('btn-action-annuler').addEventListener('click', actionAnnuler);
    document.getElementById('btn-copier-lien').addEventListener('click', ()=> copierLien(lienParent));
    document.getElementById('btn-save-convocations').addEventListener('click', enregistrerConvocations);
  }

  async function actionBut(){
    const joueur = prompt('Nom du buteur :\\n' + (etatMatch.convocations||[]).join(', '));
    if(!joueur) return;
    const data = await appelApi('enregistrerBut', { matchId: matchActuel, buteur: joueur.trim(), role: 'coach' });
    if(data.ok){ etatMatch = data.match; renderMatch(); } else afficherToast(data.error);
  }

  async function actionButAdverse(){
    const data = await appelApi('butAdverse', { matchId: matchActuel, role: 'coach' });
    if(data.ok){ etatMatch = data.match; renderMatch(); }
  }

  async function actionAnnuler(){
    if(!confirm('Annuler la toute dernière action enregistrée (vous ou les parents) ?')) return;
    const data = await appelApi('annulerDerniere', { matchId: matchActuel });
    if(data.ok){ etatMatch = data.match; renderMatch(); afficherToast('Dernière action annulée.'); }
    else afficherToast(data.error || 'Rien à annuler.');
  }

  async function enregistrerConvocations(){
    const joueurs = Array.from(document.querySelectorAll('.case-joueur input:checked')).map(c=>c.value);
    const data = await appelApi('setConvocations', { pwd, matchId: matchActuel, joueurs });
    if(data.ok){ afficherToast('Convocations enregistrées.'); ouvrirMatch(matchActuel); }
    else afficherToast(data.error || 'Erreur.');
  }

  function copierLien(lien){
    navigator.clipboard.writeText(lien).then(()=> afficherToast('Lien copié.'));
  }

  chargerAccueil();
}

/* =========================================================================
   AIGUILLAGE : présence de ?match=... dans l'URL => vue parents.
   Sinon => vue coach (protégée par mot de passe).
   Placé en toute fin de script pour que toutes les fonctions/constantes
   utilisées ci-dessus soient déjà déclarées au moment de l'appel.
   ========================================================================= */
if (matchIdDansUrl) {
  demarrerVueParents(matchIdDansUrl);
} else {
  demarrerVueCoach();
}
</script>
</body>
</html>
